name: Website uptime

# Supabase loads 3 pages of ouragents.co.uk every 5 minutes (GitHub's own
# servers are blocked by the website host's firewall, so they cannot check
# directly). Every 5 minutes this reads those results; if a page failed
# twice running, or the results stop arriving, this run fails and GitHub
# emails the account owner.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Fail on purpose to check the alert email arrives'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test the alert rule
        run: python3 tests/test_check.py
      - name: Keep the schedule switched on
        # GitHub turns off schedules in repos with no activity for 60 days.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/uptime.yml/enable" || true
      - name: Check ouragents.co.uk is loading
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_ALERT: ${{ github.event.inputs.test_alert }}
        run: python3 check.py
