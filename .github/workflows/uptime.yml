name: Website uptime

# Supabase loads 3 pages of ouragents.co.uk every 5 minutes (GitHub's own
# servers are blocked by the website host's firewall, so they cannot check
# directly). Every 5 minutes this reads those results; if a page failed
# twice running, or the results stop arriving, this run fails and an
# alert email goes to hq@ouragents.co.uk through Brevo's SMTP relay (once an hour while
# the site stays down, and again when it comes back).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Fail on purpose to check the alert email arrives'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test the alert rule
        run: python3 tests/test_check.py
      - name: Keep the schedule switched on
        # GitHub turns off schedules in repos with no activity for 60 days.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/uptime.yml/enable" || true
      - name: Did the previous check fail?
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c=$(gh run list -R "${{ github.repository }}" -w uptime.yml -e schedule -s completed -L 1 --json conclusion --jq '.[0].conclusion' || true)
          echo "conclusion=$c" >> "$GITHUB_OUTPUT"
      - name: Check ouragents.co.uk is loading
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_TO: hq@ouragents.co.uk
          PREV_CONCLUSION: ${{ steps.prev.outputs.conclusion }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_ALERT: ${{ github.event.inputs.test_alert }}
        run: python3 check.py
